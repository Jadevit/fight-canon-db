# Deploys the website to fightcanon.com: the page (site/) as the fightcanon Worker's static
# assets (wrangler.jsonc), and the latest release's data in R2 (bucket fightcanon-db, served
# at db.fightcanon.com): the pages as JSON (scripts/site_json.py, under v1/) and the database
# as Parquet (scripts/export_parquet.py, a folder per build, for the SQL page and filtered
# leaderboards). Runs when the site changes, after each database update, or by hand.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site_db.py", "scripts/site_json.py", "scripts/export_parquet.py",
            "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_run:
    workflows: ["Update database", "Discover events"]
    types: [completed]
  workflow_dispatch:

env:
  R2_BUCKET: fightcanon-db
  R2_URL: https://db.fightcanon.com

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # _json/v1/: the pages as JSON; _pq/: the database as Parquet; _cf/: the Worker's assets,
      # whose config.json points at both in R2.
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern canon.db --dir data
          pip install -q duckdb boto3
          python scripts/site_db.py data/canon.db _site.db
          python scripts/site_json.py build _site.db _json
          python scripts/export_parquet.py data/canon.db _pq
          mkdir _cf
          cp -r site/* _cf/
          mkdir -p _cf/db
          build=$(jq -r .build _pq/config.json)
          jq --arg p "$R2_URL/$build/" --arg a "$R2_URL/v1/" '.parquet = $p | .api = $a' \
            _pq/config.json > _cf/db/config.json
          live=$(curl -sf https://fightcanon.com/db/config.json | jq -r '.parquet // ""' | sed -nE 's#.*/([0-9a-f]{12})/$#\1#p' || true)
          echo "BUILD=$build" >> "$GITHUB_ENV"
          echo "LIVE=$live" >> "$GITHUB_ENV"

      # Each build of the database goes in its own folder, so a page open during a deploy keeps
      # reading the files it started with.
      - name: Upload the database to R2
        run: |
          aws s3 cp _pq/ "s3://$R2_BUCKET/$BUILD/" --recursive --exclude config.json \
            --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"

      # Only the files that changed since the last upload (v1-manifest.json in the bucket).
      - name: Upload the JSON to R2
        run: python scripts/site_json.py upload _json

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy

      # Database builds other than the live one and the one before it (v1/ stays).
      - name: Remove old builds from R2
        continue-on-error: true
        run: |
          aws s3 ls "s3://$R2_BUCKET/" | sed -nE 's#^ *PRE ([0-9a-f]{12})/$#\1#p' | while read -r old; do
            if [ "$old" != "$BUILD" ] && [ "$old" != "$LIVE" ]; then
              aws s3 rm "s3://$R2_BUCKET/$old/" --recursive --quiet
            fi
          done
