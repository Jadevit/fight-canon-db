# Weekly: find and load events that UFC Stats hosts but leaves off its events list
# (DWCS, PRIDE and other promotions), then commit the database if it changed.
# Shares the daily job's concurrency group so the two never push at the same time.
name: Discover events

on:
  schedule:
    - cron: "0 12 * * 3"   # 12:00 UTC Wednesdays, after Tuesday's DWCS episode
  workflow_dispatch:

concurrency:
  group: update-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Discover events
        id: update
        run: python -m canon_db update ufcstats --discover

      - name: Commit database
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canon.db data/summary.json
          git commit -m "data: add newly discovered events"
          git push
