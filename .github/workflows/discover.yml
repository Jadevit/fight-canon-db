# Weekly: find and load events that UFC Stats hosts but leaves off its events list (DWCS, PRIDE
# and dozens of other promotions). They can only be found by crawling fighter pages, so the daily
# job can't see them; UFC Stats adds them without notice, whatever the season. Publishes the
# database as a new release if it changed. Shares the daily job's concurrency group so the two
# never run at the same time.
name: Discover events

on:
  schedule:
    - cron: "17 12 * * 3"   # 12:17 UTC Wednesdays, after Tuesday's DWCS episode
  workflow_dispatch:

concurrency:
  group: update-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get the current database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh release view --json tagName --jq .tagName)
          gh release download "$base" --pattern canon.db --dir data
          echo "BASE=$base" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Discover events
        id: update
        run: python -m canon_db update ufcstats --discover

      - name: Publish database
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$BASE" "Weekly discovery of events missing from UFC Stats' events list."

      # Old releases: the newest 30, the first of each month and data/keep-releases.txt stay.
      - name: Prune old releases
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-releases.sh
