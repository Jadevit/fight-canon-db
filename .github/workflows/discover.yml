# Weekly: find and load events that UFC Stats hosts but leaves off its events list
# (DWCS, PRIDE and other promotions), then publish the database as a new release if it
# changed. Shares the daily job's concurrency group so the two never run at the same time.
name: Discover events

on:
  schedule:
    - cron: "0 12 * * 3"   # 12:00 UTC Wednesdays, after Tuesday's DWCS episode
  workflow_dispatch:

concurrency:
  group: update-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get the current database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern canon.db --dir data

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Discover events
        id: update
        run: python -m canon_db update ufcstats --discover

      - name: Publish database
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(python -c "import json; print(json.load(open('data/summary.json'))['coverage']['last_event'])")
          tag="db-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$tag" data/canon.db data/summary.json \
            --title "Data through ${last}" --notes "Weekly discovery of events missing from UFC Stats' events list."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          git commit -m "data: update through ${last}"
          git push
