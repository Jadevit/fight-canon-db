# Publishes site/ plus a gzipped copy of the latest released database to GitHub Pages.
# Runs when the site changes, after each database update, or by hand.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Update database", "Discover events"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern canon.db --dir data
          mkdir _site
          cp site/* _site/
          gzip -9 -c data/canon.db > _site/canon.db.gz

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
