# Daily: update the database from every source and, if its contents changed, publish
# it as a new release (canon.db + summary.json) and commit summary.json. The latest
# release is the state; raw pages are fetched fresh each run and discarded.
name: Update database

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily, after US fight-night cards wrap up
  workflow_dispatch:
    inputs:
      events:
        description: UFC Stats event ids to force-reload (space-separated)
        type: string
        default: ""
      all:
        description: Reload every UFC Stats event (~15k pages, ~4-5 h)
        type: boolean
        default: false

concurrency:
  group: update-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get the current database
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern canon.db --dir data

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Update database
        id: update
        env:
          EVENTS: ${{ inputs.events }}
          ALL: ${{ inputs.all && '--all' || '' }}
        run: |
          if [ -n "$ALL$EVENTS" ]; then
            python -m canon_db update ufcstats $ALL ${EVENTS:+--events $EVENTS}
          else
            python -m canon_db update
          fi

      - name: Publish database
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(python -c "import json; print(json.load(open('data/summary.json'))['coverage']['last_event'])")
          tag="db-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$tag" data/canon.db data/summary.json \
            --title "Data through ${last}" --notes "Daily update from UFC Stats, Sherdog and BestFightOdds."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          git commit -m "data: update through ${last}"
          git push
