<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fight Canon</title>
  <meta name="description" content="An open MMA database: every pro fight on record, from the UFC round by round to thousands of other promotions. Free to browse, query and download.">
  <meta name="theme-color" content="#1B2230">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fight Canon">
  <meta property="og:title" content="Fight Canon: every fight, on the record">
  <meta property="og:description" content="An open MMA database: every pro fight on record, from the UFC round by round to thousands of other promotions.">
  <meta property="og:url" content="https://fightcanon.com/">
  <meta property="og:image" content="https://fightcanon.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a href="/" class="brand" aria-label="Fight Canon home">
        <img src="/logo.svg" alt="" width="30" height="30">
        <span class="wordmark">FIGHT <span>CANON</span></span>
      </a>
      <form class="search" id="search" role="search" autocomplete="off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search-q" placeholder="Search fighters and events" aria-label="Search fighters and events">
        <div class="suggest" id="suggest" hidden></div>
      </form>
      <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav" id="nav">
        <a href="/fighters">Fighters</a>
        <a href="/events">Events</a>
        <a href="/leaders">Leaders</a>
        <a href="/query">Query</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap">
    <noscript><p>Fight Canon is an open MMA database. Browsing it needs JavaScript; the whole database is also a
      <a href="https://github.com/jadevit/fight-canon-db/releases/latest">free download</a>.</p></noscript>
  </main>

  <footer>
    <div class="wrap">
      <p>Data from <a href="http://ufcstats.com">UFC Stats</a>, <a href="https://www.sherdog.com">Sherdog</a>,
        <a href="https://pflmma.com">PFL</a>, <a href="https://oktagonmma.com">Oktagon</a>,
        <a href="https://www.sofascore.com">Sofascore</a>, <a href="https://mmadecisions.com">MMA Decisions</a>
        and <a href="https://www.bestfightodds.com">BestFightOdds</a>, updated daily.</p>
      <p>Free and open source. <a href="https://github.com/jadevit/fight-canon-db">GitHub</a> ·
        <a href="https://github.com/jadevit/fight-canon-db/releases/latest">Download the database</a><span id="latest"></span></p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
