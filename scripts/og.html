<!doctype html>
<!-- The link-preview image, site/og.png: open at 1200x630 and screenshot it, e.g.
     msedge --headless --window-size=1200,630 --screenshot=site/og.png scripts/og.html -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500&display=swap">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; background: #1B2230; overflow: hidden; }
    body { display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
           font-family: Inter, system-ui, sans-serif; color: #E8EAF0; }
    .brand { display: flex; align-items: center; gap: 22px; }
    .brand img { width: 120px; height: 120px; }
    .word { font: 700 92px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; }
    .word span { color: #E3A63B; }
    h1 { font: 700 64px/1.05 "Barlow Condensed", sans-serif; margin: 56px 0 18px; }
    p { margin: 0; font-size: 28px; color: #9AA3B5; }
    .kicker { font-size: 20px; font-weight: 500; letter-spacing: .14em; color: #E3A63B; margin-top: 44px; }
  </style>
</head>
<body>
  <div class="brand"><img src="../site/logo.svg" alt=""><div class="word">FIGHT <span>CANON</span></div></div>
  <h1>Every fight, on the record</h1>
  <p>An open MMA database: the UFC round by round, and thousands of promotions worldwide.</p>
  <div class="kicker">FIGHTCANON.COM</div>
</body>
</html>
